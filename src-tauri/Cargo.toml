[package]
name = "script_chat_player"
version = "1.13.0"
description = "Script Chat Player desktop shell"
authors = ["Script Chat Player"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "script_chat_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
